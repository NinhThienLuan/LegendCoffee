<!DOCTYPE html>
<html class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: sharedHead('Quản lý Ví | LegendCoffee Admin')}"></head>
<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">
  <main class="flex min-h-screen">
    <aside th:replace="~{fragments/admin-sidebar :: adminSidebar}"></aside>
    <section class="flex-1 ml-64 min-h-screen bg-surface">
      <header th:replace="~{fragments/admin-topbar :: adminTopbar('Quản lý Ví', 'Tìm kiếm theo tên, email...')}"></header>
      <div class="p-8 space-y-8">
        <div class="flex items-center justify-between">
          <h3 class="text-3xl font-extrabold text-primary font-manrope tracking-tighter">Quản lý ví người dùng</h3>
          <a th:href="@{/admin/wallets/new}"
             class="inline-flex items-center gap-2 px-5 py-2.5 text-xs font-bold bg-primary text-on-primary rounded-lg hover:bg-primary-container hover:text-primary transition-colors uppercase tracking-wider">
            <span class="material-symbols-outlined text-sm">add_circle</span>
            Thêm ví mới
          </a>
        </div>
        <div th:if="${success}" class="flex items-center gap-3 rounded-lg bg-green-50 border border-green-200 px-5 py-4 text-sm text-green-800">
          <span class="material-symbols-outlined text-green-600 text-base">check_circle</span>
          <span th:text="${success}"></span>
        </div>
        <div class="w-full">
          <table class="w-full text-left border-collapse table-fixed">
            <thead>
              <tr class="bg-surface-container-low text-[10px] uppercase tracking-widest font-bold text-on-surface-variant">
                <th class="px-6 py-4 w-[20%]">Tên người dùng</th>
                <th class="px-6 py-4 w-[20%]">Email</th>
                <th class="px-6 py-4 w-[20%]">Số dư</th>
                <th class="px-6 py-4 w-[20%]">Trạng thái</th>
                <th class="px-6 py-4 w-[20%]">Hành động</th>
              </tr>
            </thead>
            <tbody>
              <tr th:each="wallet : ${wallets}">
                <td class="px-6 py-5 text-sm" th:text="${wallet.user.fullName}"></td>
                <td class="px-6 py-5 text-sm" th:text="${wallet.user.email}"></td>
                <td class="px-6 py-5 text-sm font-bold text-primary" th:text="${#numbers.formatDecimal(wallet.amount, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></td>
                <td class="px-6 py-5 text-sm">
                  <span th:if="${wallet.active}" class="inline-block px-2 py-1 bg-green-100 text-green-700 text-[10px] font-bold uppercase rounded">Đang hoạt động</span>
                  <span th:unless="${wallet.active}" class="inline-block px-2 py-1 bg-red-100 text-red-700 text-[10px] font-bold uppercase rounded">Đã khóa</span>
                </td>
                <td class="px-6 py-5">
                  <a th:href="@{'/admin/wallets/' + ${wallet.id}}"
                     class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-bold bg-primary/10 text-primary rounded hover:bg-primary/20 transition-all">
                    <span class="material-symbols-outlined text-sm">visibility</span>
                    Xem
                  </a>
                  <a th:href="@{'/admin/wallets/' + ${wallet.id} + '/edit'}"
                     class="inline-flex items-center gap-1 px-3 py-1.5 text-xs font-bold bg-yellow-100 text-yellow-700 rounded hover:bg-yellow-200 transition-all ml-2">
                    <span class="material-symbols-outlined text-sm">edit</span>
                    Sửa
                  </a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>
  </main>
  <script src="assets/effects.js" th:src="@{/assets/effects.js}"></script>
</body>
</html>
