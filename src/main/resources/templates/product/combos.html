<!DOCTYPE html>
<html class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: sharedHead('Combo Ưu Đãi | LegendCoffee')}"></head>
<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">
  <div th:replace="~{fragments/navbar :: navbar(${navItems})}"></div>

  <main class="pt-24 pb-20">
    <section class="bg-primary py-12 text-on-primary relative overflow-hidden border-b border-outline-variant/10">
      <div class="max-w-7xl mx-auto px-8 sm:px-12 lg:px-20 relative z-10">
        <div class="max-w-2xl">
          <h1 class="text-4xl md:text-5xl font-black tracking-tighter mb-4 font-headline uppercase leading-none">COMBO<br />ƯU ĐÃI</h1>
          <p class="text-on-primary-container/80 text-sm max-w-md font-medium uppercase tracking-widest">Kết hợp nhiều biến thể với giá tốt hơn so với mua lẻ</p>
        </div>
      </div>
      <div class="absolute inset-0 bg-gradient-to-r from-primary via-primary to-transparent opacity-90 z-0"></div>
    </section>

    <section class="max-w-7xl mx-auto px-8 sm:px-12 lg:px-20 py-12">
      <div class="flex items-end justify-between mb-8">
        <div>
          <h2 class="text-xl font-black tracking-tight font-headline uppercase">Combo hiện có</h2>
          <div class="h-1 w-12 bg-primary mt-2"></div>
        </div>
        <div class="text-[10px] font-bold uppercase tracking-widest text-on-surface-variant" th:text="${#lists.size(combos) + ' combo'}">0 combo</div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
        <article th:each="combo : ${combos}" class="group bg-surface-container-lowest border border-outline-variant/20 overflow-hidden rounded-xl transition-all hover:border-primary/50 hover:shadow-xl hover:shadow-primary/5">
          <div class="p-6 space-y-4">
            <div class="flex items-start justify-between gap-4">
              <div>
                <h3 class="text-lg font-black tracking-tight font-headline uppercase group-hover:text-primary transition-colors" th:text="${combo.name}">Combo</h3>
                <p class="text-xs text-on-surface-variant mt-1" th:text="${combo.description} ?: '—'">—</p>
              </div>
              <span class="inline-flex items-center gap-1 px-2 py-1 rounded-full text-[10px] font-bold uppercase tracking-widest" th:classappend="${combo.availableNow} ? 'bg-green-100 text-green-700' : 'bg-stone-100 text-stone-500'" th:text="${combo.availableNow} ? 'Đang bán' : 'Ngoài lịch'">Đang bán</span>
            </div>

            <div class="space-y-2">
              <div class="flex items-baseline justify-between">
                <span class="text-xs uppercase tracking-widest text-on-surface-variant font-bold">Giá combo</span>
                <span class="text-2xl font-black text-primary" th:text="${#numbers.formatDecimal(combo.price, 0, 'COMMA', 0, 'POINT') + ' ₫'}">0 ₫</span>
              </div>
              <div class="flex items-baseline justify-between text-xs text-on-surface-variant">
                <span>Giá lẻ</span>
                <span th:text="${#numbers.formatDecimal(combo.originalPrice, 0, 'COMMA', 0, 'POINT') + ' ₫'}">0 ₫</span>
              </div>
              <div class="flex items-baseline justify-between text-xs text-green-700 font-semibold">
                <span>Tiết kiệm</span>
                <span th:text="${#numbers.formatDecimal(combo.savings, 0, 'COMMA', 0, 'POINT') + ' ₫'}">0 ₫</span>
              </div>
            </div>

            <div class="pt-4 border-t border-outline-variant/20">
              <p class="text-[10px] uppercase tracking-widest text-on-surface-variant font-bold mb-3">Biến thể trong combo</p>
              <ul class="space-y-2 text-sm">
                <li th:each="item : ${combo.items}" class="flex items-center justify-between gap-4">
                  <div class="min-w-0">
                    <p class="font-semibold truncate" th:text="${item.productName + ' - ' + item.variantName}">Item</p>
                    <p class="text-[10px] text-on-surface-variant" th:text="${'SL: ' + item.quantity}">SL: 1</p>
                  </div>
                  <span class="text-xs font-bold text-primary whitespace-nowrap" th:text="${#numbers.formatDecimal(item.lineTotal, 0, 'COMMA', 0, 'POINT') + ' ₫'}">0 ₫</span>
                </li>
              </ul>
            </div>
          </div>
        </article>
      </div>

      <div th:if="${#lists.isEmpty(combos)}" class="mt-16 text-center text-on-surface-variant py-16 border border-dashed border-outline-variant/30 rounded-xl">
        <span class="material-symbols-outlined text-5xl mb-4 block opacity-30">featured_play_list</span>
        <p class="text-sm font-semibold">Hiện chưa có combo nào khả dụng.</p>
      </div>
    </section>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
  <script src="/assets/effects.js" th:src="@{/assets/effects.js}"></script>
</body>
</html>
