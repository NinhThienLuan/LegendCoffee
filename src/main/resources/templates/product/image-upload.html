<!DOCTYPE html>
<html class="light" lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: sharedHead('Upload Image | Industrial Excellence')}"></head>
<body class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container">
  <div th:replace="~{fragments/navbar :: navbar(${navItems})}"></div>

  <main class="max-w-3xl mx-auto px-4 md:px-6 pt-32 pb-20">
    <section class="rounded-xl border border-outline-variant/30 bg-white p-6 md:p-8 shadow-[0_16px_40px_-30px_rgba(53,31,27,0.65)]">
      <p class="text-xs uppercase tracking-[0.18em] text-[#827471]">Image Upload Tool</p>
      <h1 class="mt-2 text-3xl md:text-4xl font-headline font-extrabold tracking-tight text-primary">Upload Product Image</h1>
      <p class="mt-3 text-sm text-[#5d524e]">Chon mot file anh, upload len Cloudinary va lay URL output de dung cho san pham.</p>

      <div th:if="${success != null}" class="mt-5 rounded-lg border border-green-300 bg-green-50 px-4 py-3 text-sm text-green-800" th:text="${success}"></div>
      <div th:if="${error != null}" class="mt-5 rounded-lg border border-red-300 bg-red-50 px-4 py-3 text-sm text-red-800" th:text="${error}"></div>

      <form th:action="@{/products/image-upload}" method="post" enctype="multipart/form-data" class="mt-6 space-y-4" novalidate>
        <div>
          <label for="image" class="block text-sm font-semibold text-[#4d3430]">Product Image</label>
          <input id="image" name="image" type="file" accept="image/*" required
            class="mt-2 w-full rounded-lg border border-outline-variant/60 bg-white file:mr-4 file:border-0 file:bg-[#4d3430] file:px-4 file:py-2 file:text-sm file:font-semibold file:text-white hover:file:bg-[#351f1b]" />
        </div>

        <button type="submit"
          class="inline-flex items-center justify-center rounded-lg bg-primary px-6 py-2.5 text-sm font-bold uppercase tracking-[0.08em] text-white hover:bg-[#2b1613] transition-colors">
          Upload Image
        </button>
      </form>

      <section th:if="${uploadedImageUrl != null}" class="mt-8 rounded-lg border border-outline-variant/40 bg-surface-container-low p-4">
        <p class="text-sm font-semibold text-[#4d3430]">Uploaded Image URL</p>
        <input type="text" readonly th:value="${uploadedImageUrl}"
          class="mt-2 w-full rounded-lg border border-outline-variant/60 bg-white px-3 py-2 text-xs md:text-sm" />

        <p th:if="${imagePublicId != null}" class="mt-3 text-xs text-[#6a5a56]">
          Public ID: <span th:text="${imagePublicId}"></span>
        </p>

        <img th:src="${uploadedImageUrl}" alt="Uploaded product image preview"
          class="mt-4 max-h-72 rounded-lg border border-outline-variant/40 object-contain bg-white" />
      </section>
    </section>
  </main>

  <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
