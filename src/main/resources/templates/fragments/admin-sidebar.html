<aside th:fragment="adminSidebar"
  class="fixed left-0 top-0 h-full flex flex-col p-4 border-r border-stone-200 dark:border-stone-800 bg-stone-100 dark:bg-stone-950 docked left-0 h-screen w-64 z-50">
  <div class="mb-10 px-4">
    <h1 class="text-lg font-black text-stone-900 dark:text-stone-100 font-manrope tracking-tighter uppercase">
      LegendCoffee</h1>
    <p class="text-xs font-semibold uppercase tracking-widest text-stone-500">Cổng quản trị hệ thống</p>
  </div>

  <nav class="flex-1 space-y-1">
    <a class="flex items-center gap-3 text-stone-500 dark:text-stone-400 px-4 py-3 mb-1 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 hover:text-stone-900 dark:hover:text-stone-50 transition-all rounded-lg"
      href="/admin"
      th:classappend="${#httpServletRequest != null and #httpServletRequest.requestURI == '/admin'} ? 'bg-stone-200 dark:bg-stone-800 !text-stone-900 dark:!text-stone-50' : ''">
      <span class="material-symbols-outlined">dashboard</span>
      <span class="font-manrope text-sm font-semibold uppercase tracking-widest">Bảng điều khiển</span>
    </a>
    <a class="flex items-center gap-3 text-stone-500 dark:text-stone-400 px-4 py-3 mb-1 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 hover:text-stone-900 dark:hover:text-stone-50 transition-all rounded-lg"
      href="/orders"
      th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/orders')} ? 'bg-stone-200 dark:bg-stone-800 !text-stone-900 dark:!text-stone-50' : ''">
      <span class="material-symbols-outlined">package_2</span>
      <span class="font-manrope text-sm font-semibold uppercase tracking-widest">Đơn hàng</span>
    </a>
    <a class="flex items-center gap-3 text-stone-500 dark:text-stone-400 px-4 py-3 mb-1 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 hover:text-stone-900 dark:hover:text-stone-50 transition-all rounded-lg"
      href="/products"
      th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/product')} ? 'bg-stone-200 dark:bg-stone-800 !text-stone-900 dark:!text-stone-50' : ''">
      <span class="material-symbols-outlined">coffee</span>
      <span class="font-manrope text-sm font-semibold uppercase tracking-widest">Sản phẩm</span>
    </a>
    <a class="flex items-center gap-3 text-stone-500 dark:text-stone-400 px-4 py-3 mb-1 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 hover:text-stone-900 dark:hover:text-stone-50 transition-all rounded-lg"
      href="/admin/posts"
      th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/admin/post')} ? 'bg-stone-200 dark:bg-stone-800 !text-stone-900 dark:!text-stone-50' : ''">
      <span class="material-symbols-outlined">article</span>
      <span class="font-manrope text-sm font-semibold uppercase tracking-widest">Bài viết</span>
    </a>
    <a class="flex items-center gap-3 text-stone-500 dark:text-stone-400 px-4 py-3 mb-1 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 hover:text-stone-900 dark:hover:text-stone-50 transition-all rounded-lg"
      href="/admin/combos"
      th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/admin/combo')} ? 'bg-stone-200 dark:bg-stone-800 !text-stone-900 dark:!text-stone-50' : ''">
      <span class="material-symbols-outlined">featured_play_list</span>
      <span class="font-manrope text-sm font-semibold uppercase tracking-widest">Combo</span>
    </a>
    <a class="flex items-center gap-3 text-stone-500 dark:text-stone-400 px-4 py-3 mb-1 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 hover:text-stone-900 dark:hover:text-stone-50 transition-all rounded-lg"
      href="/code"
      th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/code')} ? 'bg-stone-200 dark:bg-stone-800 !text-stone-900 dark:!text-stone-50' : ''">
      <span class="material-symbols-outlined">local_activity</span>
      <span class="font-manrope text-sm font-semibold uppercase tracking-widest">Mã giảm giá</span>
    </a>
    <a class="flex items-center gap-3 text-stone-500 dark:text-stone-400 px-4 py-3 mb-1 hover:bg-stone-200/50 dark:hover:bg-stone-800/50 hover:text-stone-900 dark:hover:text-stone-50 transition-all rounded-lg"
      href="/admin/wallet"
      th:classappend="${#httpServletRequest != null and #strings.startsWith(#httpServletRequest.requestURI, '/admin/wallet')} ? 'bg-stone-200 dark:bg-stone-800 !text-stone-900 dark:!text-stone-50' : ''">
      <span class="material-symbols-outlined">account_balance_wallet</span>
      <span class="font-manrope text-sm font-semibold uppercase tracking-widest">Ví tiền</span>
    </a>
  </nav>

  <div class="mt-auto pt-4 border-t border-stone-200/50 space-y-1">
    <button
      class="w-full bg-primary text-on-primary rounded-md py-3 px-4 font-manrope text-sm font-bold uppercase tracking-wider mb-4 hover:bg-primary-container transition-colors">
      Yêu cầu báo giá
    </button>
    <a class="flex items-center gap-3 text-stone-500 dark:text-stone-400 px-4 py-2 hover:text-stone-900 transition-all"
      href="#">
      <span class="material-symbols-outlined">help_center</span>
      <span class="text-xs font-semibold uppercase tracking-widest">Hỗ trợ</span>
    </a>
    <a class="flex items-center gap-3 text-stone-500 dark:text-stone-400 px-4 py-2 hover:text-stone-900 transition-all"
      th:href="@{/logout}">
      <span class="material-symbols-outlined">logout</span>
      <span class="text-xs font-semibold uppercase tracking-widest">Đăng xuất</span>
    </a>
  </div>
</aside>
