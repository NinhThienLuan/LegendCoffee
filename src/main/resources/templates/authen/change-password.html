<!DOCTYPE html>
<html class="light" lang="vi">

<head th:replace="~{fragments/head :: sharedHead('Khôi phục Mật khẩu | Hệ thống Công nghiệp')}"></head>

<body
    class="bg-surface text-on-surface selection:bg-primary-container selection:text-on-primary-container font-body antialiased min-h-screen flex flex-col">
    <!-- Navbar placeholder from fragments, same as other pages -->
    <div th:replace="~{fragments/navbar :: navbar(${navItems})}"></div>

    <style>
        .ghost-border {
            border: 1px solid rgba(212, 195, 191, 0.3)
        }

        .ghost-border:focus-within {
            border-bottom: 2px solid #351f1b;
            border-color: rgba(53, 31, 27, 0.4)
        }
    </style>

    <main class="flex-grow flex items-center justify-center pt-24 pb-12 px-6 bg-surface">
        <section
            class="w-full max-w-lg bg-surface-container-lowest p-8 md:p-12 rounded-xl border border-outline-variant/10 shadow-sm">
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-12 h-12 bg-primary/10 rounded-full mb-4">
                    <span class="material-symbols-outlined text-primary" data-icon="lock_reset">lock_reset</span>
                </div>
                <h2 class="text-2xl font-headline font-bold text-primary tracking-tight">Đổi Mật Khẩu</h2>
                <p class="text-sm text-on-surface-variant font-medium mt-2">Bảo mật tài khoản doanh nghiệp của bạn</p>
            </div>

            <!-- Single Form for Reset Password -->
            <form th:action="@{/reset-password}" th:object="${resetPasswordDto}" method="POST" id="resetPasswordForm">
                <div th:if="${errorMessage}" class="bg-error/10 border-l-4 border-error p-3 mb-6">
                    <p class="text-xs text-error font-bold" th:text="${errorMessage}"></p>
                </div>

                <!-- Step 1: Verify Old Credentials -->
                <div id="changePassStep1">
                    <div class="space-y-4">
                        <div class="space-y-1">
                            <label
                                class="block text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-1">Email
                                Tài khoản</label>
                            <div class="ghost-border bg-surface-container-low px-4 py-3 flex items-center gap-3">
                                <span class="material-symbols-outlined text-outline text-xl" data-icon="mail">mail</span>
                                <input
                                    class="bg-transparent border-none focus:ring-0 w-full text-primary placeholder:text-outline/50 font-medium"
                                    th:field="*{email}" type="email" placeholder="Nhập địa chỉ email..." required />
                            </div>
                        </div>
                        <div class="space-y-1 mb-6">
                            <label
                                class="block text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-1">Mật
                                khẩu Hiện tại</label>
                            <div class="ghost-border bg-surface-container-low px-4 py-3 flex items-center gap-3">
                                <span class="material-symbols-outlined text-outline text-xl" data-icon="key">key</span>
                                <input
                                    class="bg-transparent border-none focus:ring-0 w-full text-primary placeholder:text-outline/50 font-medium"
                                    th:field="*{oldPassword}" type="password" placeholder="••••••••" required />
                            </div>
                        </div>
                    </div>
                    <div class="pt-8">
                        <button type="button" onclick="goStep2()"
                            class="w-full bg-primary text-on-primary font-headline font-bold py-3.5 rounded-md hover:bg-primary-container transition-all flex justify-center items-center gap-2 uppercase tracking-wide">
                            Tiếp theo
                            <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
                        </button>
                        <div class="text-center mt-6">
                            <a href="/login"
                                class="text-xs font-bold text-on-surface-variant hover:text-primary transition-colors underline underline-offset-4">Hủy
                                và quay lại Đăng nhập</a>
                        </div>
                    </div>
                </div>

                <!-- Step 2: Input New Password -->
                <div id="changePassStep2" class="hidden">
                    <div class="space-y-4">
                        <div class="space-y-1">
                            <label
                                class="block text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-1">Mật
                                khẩu mới</label>
                            <div class="ghost-border bg-surface-container-low px-4 py-3 flex items-center gap-3">
                                <span class="material-symbols-outlined text-outline text-xl"
                                    data-icon="lock_open">lock_open</span>
                                <input
                                    class="bg-transparent border-none focus:ring-0 w-full text-primary placeholder:text-outline/50 font-medium"
                                    th:field="*{newPassword}" type="password" placeholder="Mật khẩu ít nhất 6 ký tự..." required />
                            </div>
                        </div>
                        <div class="space-y-1 mb-6">
                            <label
                                class="block text-[10px] font-bold uppercase tracking-widest text-on-surface-variant mb-1">Xác
                                nhận mật khẩu mới</label>
                            <div class="ghost-border bg-surface-container-low px-4 py-3 flex items-center gap-3">
                                <span class="material-symbols-outlined text-outline text-xl" data-icon="lock">lock</span>
                                <input
                                    class="bg-transparent border-none focus:ring-0 w-full text-primary placeholder:text-outline/50 font-medium"
                                    th:field="*{confirmPassword}" type="password" placeholder="Nhập lại mật khẩu..." required />
                            </div>
                        </div>
                    </div>
                    <div class="pt-8">
                        <button type="submit"
                            class="w-full bg-primary text-on-primary font-headline font-bold py-3.5 rounded-md hover:bg-primary-container transition-all flex justify-center items-center gap-2 uppercase tracking-wide">
                            Lưu mật khẩu mới
                            <span class="material-symbols-outlined text-lg" data-icon="check_circle">check_circle</span>
                        </button>
                        <div class="text-center mt-6">
                            <button type="button" onclick="goStep1()"
                                class="text-xs font-bold text-on-surface-variant hover:text-primary transition-colors underline underline-offset-4">Quay
                                lại thiết lập cũ</button>
                        </div>
                    </div>
                </div>
            </form>

        </section>
    </main>

    <!-- Footer from fragments -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <script>
        function goStep2() {
            var email = document.getElementById("email").value;
            var oldPass = document.getElementById("oldPassword").value;
            if (!email || !oldPass) {
                alert("Bạn cần nhập email và mật khẩu hiện tại!");
                return;
            }
            document.getElementById("changePassStep1").classList.add("hidden");
            document.getElementById("changePassStep2").classList.remove("hidden");
        }

        function goStep1() {
            document.getElementById("changePassStep2").classList.add("hidden");
            document.getElementById("changePassStep1").classList.remove("hidden");
        }
    </script>
</body>

</html>
